[project]
name = "la-elotiza-api"
version = "0.1.0"
description = "API de La Elotiza"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13,<2",
    "fastapi>=0.115,<1",
    "sqlalchemy>=2.0,<3",
    "tzdata>=2024.1",
    "uvicorn>=0.30,<1",
]

[project.scripts]
app = "la_elotiza_api:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = ["httpx>=0.27,<1", "pytest>=8,<10", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
# Las migraciones se generan con Alembic; no se ajustan al estilo.
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "F", "I"]
